# kitty configuration — ported from ~/.dotfiles/.config/foot/foot.ini
# Reference: man 5 kitty.conf / https://sw.kovidgoyal.net/kitty/conf/
#
# Ported for pixel-precise trackpad scrolling, which foot cannot do:
# sub-line smooth scrolling is still an open upstream request (foot#300) and
# foot's CPU renderer rounds the trackpad's pixel deltas down to whole lines.

# Match foot's term=xterm-256color rather than kitty's default xterm-kitty,
# so remote hosts without kitty's terminfo still behave.
term xterm-256color

# foot had: font=CaskaydiaMono Nerd Font:size=9
# kitty derives bold/italic from the same family, as foot did.
font_family      CaskaydiaMono Nerd Font
font_size        9.0

# foot had: pad=14x14
window_padding_width 14

# foot/alacritty both ran without a titlebar.
hide_window_decorations yes

# --- Colors -----------------------------------------------------------------
# Derived from the existing system palette rather than an imported theme.
# Greys and accents are pinned to values already used elsewhere:
#   #222222  dwl rootcolor (wallpaper)      config.h:10
#   #444444  dwl bordercolor                config.h:11
#   #005577  dwl focuscolor / waybar focused tag / fuzzel selection+border
#   #1e1e1e  waybar bar background
#   #dcdcdc  waybar + fuzzel text
#   #888888  waybar inactive tags / fuzzel prompt
#   #e5c07b  waybar warning / fuzzel match   (One Dark yellow)
#   #e06c75  waybar critical                (One Dark red)
# The two accent colors above are One Dark's, so the remaining ANSI slots are
# filled from that family for consistency.

# Near-black, one step below the bar's #1e1e1e. This puts the stack on a
# deliberate depth ladder: wallpaper #222222 > bar #1e1e1e > terminal #1a1a1a,
# so the terminal reads as the deepest surface without going to pure black.
background #1a1a1a
foreground #dcdcdc

# Selection uses the system accent, exactly as waybar's focused tag does.
selection_background #005577
selection_foreground #ffffff

cursor                #e5c07b
cursor_text_color     #1a1a1a

# Window borders mirror dwl's, so kitty splits match the compositor.
active_border_color   #005577
inactive_border_color #444444
url_color             #61afef

# Normal ANSI. The grey ramp is entirely system values.
color0  #222222
color1  #e06c75
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #dcdcdc

# Bright ANSI.
color8  #888888
color9  #ef7a85
color10 #b5e08f
color11 #f0d09a
color12 #8ac6f5
color13 #d79ae8
color14 #7fd3dd
color15 #ffffff

# --- Scrolling: the reason for this port ------------------------------------
# pixel_scroll gives sub-line increments on high-precision devices; the
# "Apple MTP multi-touch" trackpad qualifies. momentum_scroll adds the
# inertial coast after lift-off. Both are kitty defaults, set explicitly
# because they are the point of the exercise.
pixel_scroll            yes
momentum_scroll         0.96
touch_scroll_multiplier 1.0

# kitty's default is "scrolled", which pops a scrollbar on the right edge as
# soon as you scroll back. foot showed no such bar; disable it entirely.
scrollbar never

# --- Bell -------------------------------------------------------------------
# kitty beeps on every ^G, which in practice means readline/shell completion
# rejecting a keystroke — a sound on typing, not on anything worth hearing.
# The visual bell is already off by default (visual_bell_duration 0).
enable_audio_bell no

# --- Key bindings -----------------------------------------------------------
# Cmd+<key> is remapped to Ctrl+<key> at the evdev level by keyd
# (~/.dotfiles/etc/keyd/default.conf), so Cmd+Shift+C arrives here as
# Ctrl+Shift+C — kitty's default copy binding. No mapping needed for it.
#
# NOT ported from foot.ini: clipboard-copy's Mod4+c / Mod4+x and
# clipboard-paste's Mod4+v. keyd consumes meta+c/x/v and rewrites them to
# Ctrl+c/x/v, so those Super chords can never reach the terminal. They were
# leftovers from the pre-keyd Hyprland setup and are dead bindings.

# foot: fullscreen=F11 (alacritty: ToggleFullscreen)
map f11 toggle_fullscreen

# foot: clipboard-copy included Control+Insert
map ctrl+insert copy_to_clipboard

# foot: clipboard-paste included Shift+Insert, and set primary-paste=none so
# the chord meant clipboard rather than primary. kitty's default for
# shift+insert is paste_from_selection, so this override preserves the intent.
map shift+insert paste_from_clipboard
