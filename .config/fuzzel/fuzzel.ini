# fuzzel launcher — matches Waybar dark grey theme (see waybar/style.css)
[main]
font=JetBrainsMono Nerd Font:size=13
terminal=foot
prompt="> "
lines=12
width=40
horizontal-pad=16
vertical-pad=10
inner-pad=6

[colors]
# bar background is rgba(30,30,30,0.92); wallpaper is solid #222222
background=1e1e1eeb
text=dcdcdcff
prompt=888888ff
placeholder=888888ff
input=dcdcdcff
match=e5c07bff
selection=005577ff
selection-text=ffffffff
selection-match=e5c07bff
border=005577ff

[border]
width=2
radius=12
