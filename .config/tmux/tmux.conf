# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1 \; run-shell -b "~/.local/bin/tmux-autosave"
bind -n M-S-Right swap-window -t +1 \; select-window -t +1 \; run-shell -b "~/.local/bin/tmux-autosave"

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Persistence: save on every layout change (see hooks below), restore on
# server start. Periodic saving stays off; the hooks are more timely and don't
# write when nothing moved.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-delete-backup-after '3'
# Relaunch claude panes with their previous conversation
set -g @resurrect-processes '"~claude->claude --continue"'

# Restoring recreates every window and pane, which would fire the hooks below
# and save the half-built state over the good one. These pause them.
set -g @resurrect-hook-pre-restore-all  '~/.local/bin/tmux-autosave inhibit'
set -g @resurrect-hook-post-restore-all '~/.local/bin/tmux-autosave resume'

# Anything that changes what a restore would have to rebuild: panes and windows
# appearing or disappearing, sessions coming and going, layout and names.
# window-layout-changed is the broad one - it covers splitting, killing,
# breaking, joining and resizing panes. The script coalesces a burst of these
# into one save.
set-hook -g pane-exited            'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g after-kill-pane        'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g after-split-window     'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g window-layout-changed  'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g window-linked          'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g window-unlinked        'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g after-rename-window    'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g after-rename-session   'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g after-new-session      'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g session-closed         'run-shell -b "~/.local/bin/tmux-autosave"'
set-hook -g client-detached        'run-shell -b "~/.local/bin/tmux-autosave"'
# swap-window and move-window have no hook of their own, so the bindings that
# reorder windows (M-S-Left/Right, above) save for themselves.

# Initialize TPM (keep this line last)
run '~/.config/tmux/plugins/tpm/tpm'

# single line scroll
bind -T copy-mode WheelUpPane \
    send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane \
    send-keys -X -N 1 scroll-down

bind -T copy-mode-vi WheelUpPane \
    send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane \
    send-keys -X -N 1 scroll-down
