# foot configuration — translated from ~/.config/alacritty/alacritty.toml
# Reference: man 5 foot.ini

[main]
# Mirrors alacritty's `general.import` of the current Omarchy theme.
# The theme ships a foot.ini (colors); foot errors if this file is missing.
# Disabled on this machine: omarchy theme is not installed (foot errors without it).
# include=~/.config/omarchy/current/theme/foot.ini
term=xterm-256color
# alacritty used CaskaydiaMono Nerd Font (Regular/Bold/Italic) at size 9.
# foot auto-derives the bold/italic variants from the same family.
font=CaskaydiaMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
# alacritty had decorations="None"; foot draws no server-side titlebar under
# Hyprland, so this needs no extra setting to match.

# [colors-dark], not [colors]: foot 1.27 deprecated the plain [colors] section
# in favor of a dark/light pair. initial-color-theme defaults to dark, and no
# [colors-light] is defined, so this is the only theme in play.
[colors-dark]
# Ported back from ~/.dotfiles/.config/kitty/kitty.conf, which is where this
# palette was actually built. Derived from the system values already in use
# (dwl config.h, waybar, fuzzel) rather than an imported theme:
#   #222222  dwl rootcolor      #444444  dwl bordercolor
#   #005577  dwl focuscolor / waybar focused tag / fuzzel selection
#   #dcdcdc  waybar + fuzzel text     #888888  waybar inactive tags
# The two accents already in use (#e5c07b yellow, #e06c75 red) are One Dark's,
# so the remaining ANSI slots are filled from that family for consistency.
#
# Near-black, one step below the bar's #1e1e1e, keeping the depth ladder
# wallpaper #222222 > bar #1e1e1e > terminal #1a1a1a.
background=1a1a1a
foreground=dcdcdc

# Selection uses the system accent, exactly as waybar's focused tag does.
selection-background=005577
selection-foreground=ffffff

urls=61afef

# Text color, then cursor color (foot's order is the reverse of kitty's
# cursor/cursor_text_color pair). Lives here, not in [cursor] — foot 1.27
# rejects a `color` key in [cursor].
cursor=1a1a1a e5c07b

# Normal ANSI. The grey ramp is entirely system values.
regular0=222222
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=dcdcdc

# Bright ANSI.
bright0=888888
bright1=ef7a85
bright2=b5e08f
bright3=f0d09a
bright4=8ac6f5
bright5=d79ae8
bright6=7fd3dd
bright7=ffffff

[key-bindings]
# F11 -> fullscreen (alacritty: ToggleFullscreen)
fullscreen=F11
# Copy: foot's default Control+Shift+c, plus alacritty's Control+Insert and the
# macOS-style Super+C / Super+X fallbacks (Super = Mod4). Control+Shift+c is kept
# because macos-key.sh sends it to terminals for copy.
clipboard-copy=Control+Shift+c Control+Insert Mod4+c Mod4+x
# Paste: foot's default Control+Shift+v, plus alacritty's Shift+Insert and Super+V.
clipboard-paste=Control+Shift+v Shift+Insert Mod4+v
# Shift+Insert is reassigned to clipboard paste above; disable the default
# keyboard primary-paste so the bindings don't clash (foot rejects duplicates).
# Middle-click primary paste is a mouse binding and is unaffected.
primary-paste=none
