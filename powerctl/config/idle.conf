# powerctl idle rules. Seconds; 0 means never.
# Edit via `powerctl idle set [ac|bat|both] <screen|sleep> <duration>`.
#
# Defaults mirror what was hardcoded in ~/.config/dwl/startup.sh.
#
# SLEEP HAS PRECEDENCE. If a source's SLEEP is at or before its SCREEN, the
# suspend owns the idle period and the screen rule never fires -- suspending
# blanks the display anyway, and swayidle's before-sleep hook has already
# locked. Keep SCREEN below SLEEP if you want both. `powerctl idle` flags the
# pairs where it doesn't.
#
# Note: keyboard input cannot wake s2idle on this Asahi kernel -- waking needs
# the lid or power button. A short IDLE_BAT_SLEEP is therefore more disruptive
# here than on a typical laptop, and 0 is a reasonable everyday setting.
#
# Closing the lid is logind's business, not swayidle's: `powerctl lid`.

IDLE_AC_SCREEN=600
IDLE_AC_SLEEP=0

IDLE_BAT_SCREEN=180
IDLE_BAT_SLEEP=600
