# powerctl charging rules.  Edit via `powerctl cap N` / `powerctl health`,
# or by hand followed by `powerctl apply`.
#
# Idle rules are NOT here -- they are session policy and need no root:
#   ~/.config/powerctl/idle.conf

# Which rule drives the thresholds: cap | health | none
ACTIVE=none

# cap rule
CAP_START=75      # charging resumes below this
CAP_STOP=80       # charging stops here

# health rule -- target derived from state of health, clamped to this range.
# See `powerctl health --explain`.
HEALTH_FLOOR=60
HEALTH_CEILING=90

# Cell chemistry is not readable on this hardware (no `technology` attribute;
# UPower reports Technology=0). Stated here so the assumption is visible.
CHEMISTRY=li-ion
